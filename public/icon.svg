<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#0c1a2e" />
      <stop offset="100%" stop-color="#03060c" />
    </radialGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
    <radialGradient id="sphere" cx="38%" cy="34%" r="75%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.04" />
    </radialGradient>
  </defs>

  <!-- Background: full-bleed so it also works as a maskable icon -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Globe (kept inside the 80% maskable safe zone) -->
  <g fill="none" stroke="url(#rim)" stroke-linecap="round">
    <circle cx="256" cy="256" r="150" fill="url(#sphere)" stroke-width="14" />
    <!-- Meridians -->
    <ellipse cx="256" cy="256" rx="62" ry="150" stroke-width="9" />
    <line x1="256" y1="106" x2="256" y2="406" stroke-width="9" />
    <!-- Parallels -->
    <line x1="106" y1="256" x2="406" y2="256" stroke-width="9" />
    <path d="M 128 180 Q 256 214 384 180" stroke-width="8" />
    <path d="M 128 332 Q 256 298 384 332" stroke-width="8" />
  </g>

  <!-- Orbit ring with a satellite: the live-events "hub" -->
  <ellipse cx="256" cy="256" rx="196" ry="64" transform="rotate(-24 256 256)" fill="none" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="6" />
  <circle cx="398" cy="158" r="16" fill="#facc15" />
</svg>
