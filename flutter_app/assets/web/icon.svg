<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#092837" />
      <stop offset="100%" stop-color="#031b26" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="112" fill="none" stroke="#14b8a6" stroke-opacity="0.3" stroke-width="4" />

  <!-- Radar Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#0ea5e9" stroke-opacity="0.2" stroke-width="3" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#2dd4bf" stroke-opacity="0.35" stroke-width="3" />
  <circle cx="256" cy="256" r="60" fill="none" stroke="#2dd4bf" stroke-opacity="0.5" stroke-width="2.5" />

  <!-- Radar Sweep Cone -->
  <path d="M 256 256 L 380 132 A 180 180 0 0 1 436 256 Z" fill="url(#tealGrad)" fill-opacity="0.25" />

  <!-- Cloud Shape -->
  <path d="M 170 320 A 45 45 0 0 1 150 235 A 65 65 0 0 1 270 205 A 55 55 0 0 1 350 250 A 45 45 0 0 1 335 320 Z" fill="#ffffff" fill-opacity="0.9" filter="url(#glow)" />

  <!-- Lightning Bolt -->
  <polygon points="265,260 230,335 260,335 240,410 300,315 270,315" fill="url(#amberGrad)" filter="url(#glow)" stroke="#ffffff" stroke-width="2" />

  <!-- Center Pulse Dot -->
  <circle cx="256" cy="256" r="8" fill="#2dd4bf" filter="url(#glow)" />
</svg>
