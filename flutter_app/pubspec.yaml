name: meteoradar_flutter
description: MeteoRadar 3D & Storm Track Flutter Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  webview_flutter: ^4.10.0
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  flutter_local_notifications: ^18.0.1
  audioplayers: ^6.1.0
  vibration: ^2.0.1
  http: ^1.2.2
  connectivity_plus: ^6.1.1
  shared_preferences: ^2.3.3
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/web/
    - assets/web/assets/
